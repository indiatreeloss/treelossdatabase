<style>
/* Layout: sticky header + filter bar over a map (left) and a scrolling list (right); stacked on phones. */
:root{
  --bg:#f3f6f3; --surface:#ffffff; --ink:#15201a; --muted:#566a5f; --line:#d9e1db; --chip:#e8eee9;
  --accent:#1d5a42; --accent-ink:#ffffff; --focus:#1d5a42;
  --s-proposed:#d99a00; --s-approved:#2a6fdb; --s-ongoing:#e0401c; --s-completed:#7a3fb8; --s-stayed:#16934f; --s-reduced:#5d7f8c; --s-other:#8a8f8c;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-head:"Space Grotesk","Inter",system-ui,sans-serif;
  --gutter:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1511; --surface:#16201a; --ink:#e7efe9; --muted:#95a89c; --line:#27352d; --chip:#1f2c25;
    --accent:#6fd3a1; --accent-ink:#0b1a12; --focus:#6fd3a1;
    --s-proposed:#f2b01e; --s-approved:#6ea2ff; --s-ongoing:#ff6a45; --s-completed:#b98cf0; --s-stayed:#3fcf84; --s-reduced:#8fb2bf; --s-other:#9aa39e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#16201a; --ink:#e7efe9; --muted:#95a89c; --line:#27352d; --chip:#1f2c25;
  --accent:#6fd3a1; --accent-ink:#0b1a12; --focus:#6fd3a1;
  --s-proposed:#f2b01e; --s-approved:#6ea2ff; --s-ongoing:#ff6a45; --s-completed:#b98cf0; --s-stayed:#3fcf84; --s-reduced:#8fb2bf; --s-other:#9aa39e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body);display:flex;flex-direction:column;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}

header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:10px}
h1{font:700 20px/1.2 var(--font-head);margin:0;letter-spacing:-.01em;flex:none}
.brand{display:block;line-height:0}
.brand img{display:block;height:44px;width:auto;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sub{color:var(--muted);font-size:13px;flex:1 1 320px;min-width:0}

.filters{position:relative;background:var(--surface);border-bottom:1px solid var(--line)}
.filters .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px}
.search{flex:1 1 220px;min-width:180px;max-width:340px;height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--bg)}
.facet{position:relative}
.fbtn{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fbtn[aria-expanded="true"]{border-color:var(--accent)}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fbtn .n{font-variant-numeric:tabular-nums;font-weight:600}
.fbtn::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);margin-left:2px}
.pop{position:absolute;z-index:1200;top:calc(100% + 6px);left:0;min-width:240px;max-width:min(360px,calc(100vw - 32px));max-height:min(420px,60vh);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px}
.pop[hidden]{display:none}
.opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;cursor:pointer}
.opt:hover{background:var(--chip)}
.opt input{margin:0;accent-color:var(--accent)}
.opt .lbl{flex:1;min-width:0}
.opt .ct{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.opt.zero{opacity:.45}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.pop .row{display:flex;gap:8px;align-items:center;padding:6px 8px}
.pop .row label{width:44px;color:var(--muted)}
.pop select,.pop input[type=number]{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--bg)}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px}
.chipbtn{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12.5px}
.chipbtn:hover{border-color:var(--accent)}
.spacer{flex:1}
.ftoggle{display:none}
.ftoggle::after{display:none}
.linkbtn{background:none;border:0;color:var(--accent);padding:6px 4px;text-decoration:underline;text-underline-offset:2px}

.activebar{border-top:1px solid var(--line)}
.activebar .wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:8px}
.count{font-weight:600;font-variant-numeric:tabular-nums;margin-right:6px}
.achip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px}
.achip button{border:0;background:none;width:20px;height:20px;border-radius:50%;line-height:1;color:var(--muted)}
.achip button:hover{background:var(--line);color:var(--ink)}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,440px);height:calc(100vh - 150px);min-height:520px}
#map{height:100%;min-height:320px;background:var(--chip);position:relative;z-index:0}
.mapcol{position:relative;min-width:0;min-height:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
.legend{position:absolute;left:10px;bottom:10px;z-index:500;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;max-width:230px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.legend h3{margin:0 0 4px;font:600 11px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.legend button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:2px 2px;border-radius:4px}
.legend button:hover{background:var(--chip)}
.legend button.off{opacity:.4}
.legend .ct{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.legend .lt{display:flex;width:100%;align-items:center;justify-content:space-between;font:600 11px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:2px}
.legend.collapsed .lbody{display:none}
.sizes{display:flex;align-items:flex-end;gap:10px;margin-top:8px;padding-top:6px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px}
.sizes span{display:flex;flex-direction:column;align-items:center;gap:2px}
.sizes i{display:block;border:1.5px solid var(--muted);border-radius:50%}
.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:600;pointer-events:none}
.empty div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;pointer-events:auto}
.empty.show{display:flex}

aside.list{display:flex;flex-direction:column;min-height:0;min-width:0;border-left:1px solid var(--line);background:var(--bg)}
.listhead{display:flex;align-items:center;gap:8px;padding:10px var(--gutter);border-bottom:1px solid var(--line);background:var(--surface)}
.listhead select{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:0 6px}
#cards{overflow:auto;flex:1;padding:10px var(--gutter) 24px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.card .loc{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.card .place{font:600 15px/1.25 var(--font-head);min-width:0;overflow-wrap:anywhere}
.card .trees{font:700 18px/1 var(--font-head);font-variant-numeric:tabular-nums;white-space:nowrap}
.card .trees small{font:500 11px var(--font-body);color:var(--muted);margin-left:3px}
.card p{margin:0;overflow-wrap:anywhere}
.card .meta{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;line-height:1.7}
.tag:hover{border-color:var(--accent)}
.tag.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag.status{color:#fff;border-color:transparent;font-weight:500}
.card a{color:var(--accent);text-underline-offset:2px}
.card details{font-size:12.5px;color:var(--muted)}
.card summary{cursor:pointer}
.card .actions{display:flex;gap:2px 14px;align-items:center;flex-wrap:wrap}
.card .actions .linkbtn{padding:3px 0}
.srcs{display:flex;flex-wrap:wrap;gap:4px 12px}
footer.note{padding:10px var(--gutter);font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:var(--surface)}
.leaflet-popup-content{font:13px/1.4 var(--font-body);margin:10px 12px}
.leaflet-popup-content b{font-family:var(--font-head)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink)}
.leaflet-container a{color:var(--accent)}

.listtools{display:flex;flex-wrap:wrap;gap:6px;padding:8px var(--gutter);border-bottom:1px solid var(--line);background:var(--surface)}
a.chipbtn{text-decoration:none;color:inherit;display:inline-block}
.summary{padding:8px var(--gutter);font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.summary .si{display:inline-flex;align-items:center;gap:5px;margin-right:12px;white-space:nowrap}
a.linkbtn{background:none;color:var(--accent);padding:6px 4px;text-decoration:underline;text-underline-offset:2px;display:inline-block}
footer.note a{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:3000;font-size:13px;max-width:calc(100vw - 32px)}
.mc{background:transparent}
.mc span{display:flex;width:100%;height:100%;align-items:center;justify-content:center;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 13px var(--font-body);border:2px solid var(--surface);box-shadow:0 1px 6px rgba(0,0,0,.35);opacity:.92}
@media (max-width:860px){
  html,body{height:auto}
  main{display:block;height:auto;flex:none;min-height:0}
  .mapcol{height:46vh;min-height:300px}
  aside.list{border-left:0;border-top:1px solid var(--line)}
  #cards{overflow:visible}
  .facet{position:static}
  .pop{left:max(var(--gutter),env(safe-area-inset-left,0px));right:max(var(--gutter),env(safe-area-inset-right,0px));max-width:none;top:calc(100% - 4px)}
  .legend{max-width:190px;font-size:12px}
  .brand img{height:36px}
  .ftoggle{display:inline-flex}
  #bar.collapsed .facet{display:none}
  .search{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1><a class="brand" href="./"><img src="logo.png" alt="TreeLoss.in" width="156" height="44"><span class="sr">India Tree Loss Database</span></a></h1>
  <div class="sub">Tree fellings of more than 1,000 trees reported in Indian news, 2021 to 2026. Tree counts are as reported, and some are estimates or claims. Map positions are approximate (town or district centre).</div>
</div></header>

<section class="filters" aria-label="Filters">
  <div class="wrap" id="bar">
    <input class="search" id="q" type="search" placeholder="Search place, project, authority" aria-label="Search">
    <div class="facet" data-facet="states"><button class="fbtn" aria-expanded="false">State</button><div class="pop" hidden></div></div>
    <div class="facet" data-facet="statuses"><button class="fbtn" aria-expanded="false">Status</button><div class="pop" hidden></div></div>
    <div class="facet" data-facet="year"><button class="fbtn" aria-expanded="false">Year</button><div class="pop" hidden></div></div>
    <div class="facet" data-facet="trees"><button class="fbtn" aria-expanded="false">Trees</button><div class="pop" hidden></div></div>
    <div class="facet" data-facet="types"><button class="fbtn" aria-expanded="false">Project type</button><div class="pop" hidden></div></div>
    <div class="facet" data-facet="sectors"><button class="fbtn" aria-expanded="false">Govt / private</button><div class="pop" hidden></div></div>
    <div class="facet" data-facet="auths"><button class="fbtn" aria-expanded="false">Authority</button><div class="pop" hidden></div></div>
    <button class="fbtn ftoggle" id="ftoggle" aria-expanded="false">Filters</button>
    <span class="spacer"></span>
    <div class="facet" data-facet="presets"><button class="fbtn" aria-expanded="false">Example queries</button><div class="pop" hidden></div></div>
  </div>
  <div class="activebar"><div class="wrap" id="active"></div></div>
</section>

<main>
  <div class="mapcol">
    <div id="map" role="application" aria-label="Map of tree felling projects"></div>
    <div class="legend" id="legend"></div>
    <div class="empty" id="empty"><div>No projects match these filters.</div></div>
  </div>
  <aside class="list" aria-label="Projects">
    <div class="listhead">
      <strong id="listcount" style="font-variant-numeric:tabular-nums"></strong>
      <span class="spacer"></span>
      <label for="sort" style="color:var(--muted)">Sort</label>
      <select id="sort">
        <option value="recent">Most recent</option>
        <option value="trees">Most trees</option>
        <option value="state">State A to Z</option>
      </select>
    </div>
    <div class="listtools">
      <button class="chipbtn" id="dl">Download CSV</button>
      <button class="chipbtn" id="cplink">Copy link to this view</button>
      <a class="chipbtn" id="wa" target="_blank" rel="noopener" href="https://wa.me/">Share on WhatsApp</a>
    </div>
    <div class="summary" id="summary"></div>
    <div id="cards"></div>
  </aside>
</main>
<footer class="note" id="foot"></footer>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

  document.getElementById("wa").href="https://wa.me/?text="+encodeURIComponent("Tree felling projects in India: "+rows.length+" match this view. "+viewUrl());
}

/* ---------- Facets ---------- */
function counts(facet){
  var m={};
  DATA.forEach(function(r){ if(!pass(r,facet)) return;
    var v= facet==="states"?r.states: facet==="types"?r.types: facet==="auths"?r.auths: [facet==="statuses"?r.status:r.sector];
    v.forEach(function(x){m[x]=(m[x]||0)+1});
  });
  return m;
}
function allValues(facet){
  var m={};
  DATA.forEach(function(r){ var v= facet==="states"?r.states: facet==="types"?r.types: facet==="auths"?r.auths: [facet==="statuses"?r.status:r.sector]; v.forEach(function(x){m[x]=1}); });
  var arr=Object.keys(m);
  if(facet==="statuses") return STATUSES.map(function(s){return s.key}).filter(function(k){return m[k]});
  return arr.sort();
}
function renderPop(facet){
  var el=document.querySelector('.facet[data-facet="'+facet+'"] .pop'), h="";
  if(SETS.indexOf(facet)>=0){
    var c=counts(facet);
    allValues(facet).forEach(function(v){
      var n=c[v]||0, dot = facet==="statuses"?'<span class="dot" style="background:'+statusColor(v)+'"></span>':"";
      h+='<label class="opt'+(n?"":" zero")+'"><input type="checkbox" data-f="'+facet+'" data-v="'+esc(v)+'"'+(F[facet].has(v)?" checked":"")+'>'+dot+'<span class="lbl">'+esc(v)+'</span><span class="ct">'+n+'</span></label>';
    });
    if(F[facet].size) h+='<div class="quick"><button class="linkbtn" data-clear="'+facet+'">Clear</button></div>';
  } else if(facet==="year"){
    var ys=[]; DATA.forEach(function(r){if(r.year!=null&&ys.indexOf(r.year)<0) ys.push(r.year)}); ys.sort();
    function opts(sel){return '<option value="">Any</option>'+ys.map(function(y){return '<option'+(sel===y?" selected":"")+'>'+y+'</option>'}).join("")}
    h='<div class="row"><label for="yf">From</label><select id="yf">'+opts(F.yearFrom)+'</select></div><div class="row"><label for="yt">To</label><select id="yt">'+opts(F.yearTo)+'</select></div>'+
      '<div class="quick"><button class="chipbtn" data-yr="last">Last year</button><button class="chipbtn" data-yr="since2023">Since 2023</button><button class="linkbtn" data-clear="year">Clear</button></div>'+
      '<div class="row" style="color:var(--muted);font-size:12px">Year the news report appeared. Rows with no year are hidden while a year is set.</div>';
  } else if(facet==="trees"){
    h='<div class="row"><label for="tmin">Min</label><input id="tmin" type="number" min="0" step="1" placeholder="0" value="'+(F.minT==null?"":F.minT)+'"></div><div class="row"><label for="tmax">Max</label><input id="tmax" type="number" min="0" step="1" placeholder="No limit" value="'+(F.maxT==null?"":F.maxT)+'"></div>'+
      '<div class="quick"><button class="chipbtn" data-tr="5000">5,000+</button><button class="chipbtn" data-tr="10000">10,000+</button><button class="chipbtn" data-tr="50000">50,000+</button><button class="chipbtn" data-tr="100000">1 lakh+</button><button class="linkbtn" data-clear="trees">Clear</button></div>'+
      '<div class="row" style="color:var(--muted);font-size:12px">Only projects above 1,000 trees are included in this site.</div>';
  } else if(facet==="presets"){
    h=PRESETS.map(function(p,i){return '<button class="opt" style="width:100%;border:0;background:none;text-align:left" data-preset="'+i+'"><span class="lbl">'+esc(p.name)+'</span></button>'}).join("");
  }
  el.innerHTML=h;
}
var PRESETS=[
  {name:"Felled in Karnataka since 2023",set:function(){F.states.add("Karnataka");F.statuses.add("Ongoing");F.statuses.add("Completed");F.yearFrom=2023;}},
  {name:"Proposed urban infrastructure, all India",set:function(){F.statuses.add("Proposed");F.types.add("Urban infrastructure");}},
  {name:"NHAI and Railways, last year",set:function(){F.auths.add("NHAI");F.auths.add("Railways");F.yearFrom=new Date().getFullYear()-1;}},
  {name:"Stayed by courts or tribunals",set:function(){F.statuses.add("Stayed / stopped");}},
  {name:"Private companies, 10,000+ trees",set:function(){F.sectors.add("Private");F.minT=10000;}}
];
function closePops(){
  document.querySelectorAll(".pop").forEach(function(p){p.hidden=true});
  document.querySelectorAll(".fbtn").forEach(function(b){b.setAttribute("aria-expanded","false")});
  openFacet=null;
}
function setFilterLabels(){
  function mark(facet,text,on){ var b=document.querySelector('.facet[data-facet="'+facet+'"] .fbtn'); b.classList.toggle("on",on); b.innerHTML=text; }
  var names={states:"State",statuses:"Status",types:"Project type",sectors:"Govt / private",auths:"Authority"};
  SETS.forEach(function(k){ var n=F[k].size; mark(k,names[k]+(n?' <span class="n">'+n+'</span>':""),!!n); });
  var y=F.yearFrom!=null||F.yearTo!=null; mark("year","Year"+(y?' <span class="n">'+(F.yearFrom||"")+(F.yearFrom!=null&&F.yearTo!=null&&F.yearFrom===F.yearTo?"":"–"+(F.yearTo||""))+'</span>':""),y);
  var t=F.minT!=null||F.maxT!=null; mark("trees","Trees"+(t?' <span class="n">'+(F.minT!=null?"≥"+fmt(F.minT):"")+(F.maxT!=null?" ≤"+fmt(F.maxT):"")+'</span>':""),t);
}
function renderActive(rows){
  var h='<span class="count">'+rows.length+' of '+DATA.length+' projects</span>', any=false;
  function chip(label,f,v){any=true; h+='<span class="achip">'+esc(label)+'<button aria-label="Remove '+esc(label)+'" data-rm="'+f+'" data-v="'+esc(v||"")+'">×</button></span>';}
  if(F.q) chip('Search: "'+F.q+'"',"q");
  SETS.forEach(function(k){F[k].forEach(function(v){chip(v,k,v)})});
  if(F.yearFrom!=null||F.yearTo!=null) chip("Year "+(F.yearFrom||"…")+(F.yearFrom===F.yearTo?"":" to "+(F.yearTo||"…")),"year");
  if(F.minT!=null||F.maxT!=null) chip("Trees "+(F.minT!=null?"≥ "+fmt(F.minT):"")+(F.maxT!=null?" ≤ "+fmt(F.maxT):""),"trees");
  if(any) h+='<button class="linkbtn" data-rm="all">Clear all</button>';
  document.getElementById("active").innerHTML=h;
}

/* ---------- Cards ---------- */
function placeName(r){
  var bits=[]; if(r.town) bits.push(r.town); else if(r.district) bits.push(r.district);
  bits.push(r.states.join(" / ")); return bits.join(", ");
}
function tagBtn(f,v,label,cls,style){ return '<button class="tag'+(cls?" "+cls:"")+(isOn(f,v)?" on":"")+'" data-f="'+f+'" data-v="'+esc(v)+'"'+(style?' style="'+style+'"':"")+'>'+esc(label||v)+'</button>'; }
function isOn(f,v){ if(f==="year") return F.yearFrom==+v&&F.yearTo==+v; return F[f]&&F[f].has&&F[f].has(v); }
function cardHTML(r){
  var h='<div class="loc"><div class="place">'+esc(placeName(r))+'</div><div class="trees">'+(r.trees==null?'<small>count n/a</small>':fmt(r.trees)+'<small>trees</small>')+'</div></div>';
  h+='<p>'+esc(r.project_purpose)+'</p>';
  h+='<div class="meta">'+(r.authority?'Authority: '+esc(r.authority):'Authority not stated')+'</div>';
  h+='<div class="tags">'+tagBtn("statuses",r.status,r.status,"status","background:"+statusColor(r.status));
  if(r.year!=null) h+=tagBtn("year",String(r.year),String(r.year));
  r.states.forEach(function(s){h+=tagBtn("states",s)});
  h+=tagBtn("sectors",r.sector);
  r.types.forEach(function(s){h+=tagBtn("types",s)});
  r.auths.forEach(function(s){h+=tagBtn("auths",s)});
  h+='</div>';
  if(r.status_detail) h+='';
  if(r.status && r.status!==r.status_raw) {}
  h+='<div class="meta">Status as reported: '+esc(r.status_raw)+'</div>';
  var srcs='<a href="'+esc(r.source_url)+'" target="_blank" rel="noopener">'+esc(r.source_name||"Source")+' ↗</a>';
  (r.other_source_urls||"").split(/\s*;\s*/).filter(Boolean).forEach(function(u,i){ srcs+=' <a href="'+esc(u)+'" target="_blank" rel="noopener">Other report '+(i+1)+' ↗</a>'; });
  h+='<div class="srcs">'+srcs+'</div>';
  if(r.earlier_reports_merged) h+='<details><summary>Earlier reports of this project</summary>'+esc(r.earlier_reports_merged)+'</details>';
  h+='<div class="actions"><button class="linkbtn" data-zoom="'+r.id+'">Show on map</button><button class="linkbtn" data-copyrow="'+r.id+'">Copy link</button><a class="linkbtn" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(shareText(r))+'">WhatsApp</a><a class="linkbtn" target="_blank" rel="noopener" href="'+esc(issueUrl(r))+'">Suggest a correction</a></div>';
  return h;
}
function sortRows(rows){
  var s=document.getElementById("sort").value, a=rows.slice();
  if(s==="trees") a.sort(function(x,y){return (y.trees||-1)-(x.trees||-1)});
  else if(s==="state") a.sort(function(x,y){return x.states[0]<y.states[0]?-1:x.states[0]>y.states[0]?1:(y.year||0)-(x.year||0)});
  else a.sort(function(x,y){return (y.year||0)-(x.year||0)||(y.trees||-1)-(x.trees||-1)});
  return a;
}

/* ---------- Map ---------- */
function offsets(rows){
  var groups={};
  rows.forEach(function(r){var k=r.ll[0].toFixed(2)+","+r.ll[1].toFixed(2); (groups[k]=groups[k]||[]).push(r)});
  var pos={};
  Object.keys(groups).forEach(function(k){
    var g=groups[k]; g.sort(function(a,b){return (b.trees||0)-(a.trees||0)});
    g.forEach(function(r,i){
      if(g.length===1||i===0&&g.length===1){pos[r.id]=r.ll;return;}
      var ang=i*2.399963, d=0.05*Math.sqrt(i+1);
      pos[r.id]=[r.ll[0]+d*Math.sin(ang), r.ll[1]+d*Math.cos(ang)];
    });
  });
  return pos;
}
function drawMap(rows,refit){
  layer.clearLayers(); markers={};
  var pos=offsets(DATA);
  var ordered=rows.slice().sort(function(a,b){return (b.trees||0)-(a.trees||0)});
  ordered.forEach(function(r){
    var col=statusColor(r.status);
    var m=L.circleMarker(pos[r.id],{radius:radius(r.trees),color:col,weight:r.trees==null?2:1.5,dashArray:r.trees==null?"3 3":null,fillColor:col,fillOpacity:r.trees==null?0.12:0.45});
    m.bindTooltip(esc(placeName(r))+" · "+(r.trees==null?"count n/a":fmt(r.trees)+" trees"),{direction:"top"});
    m.on("click",function(){selectRow(r.id,false)});
    layer.addLayer(m); markers[r.id]=m;
  });
  document.getElementById("empty").classList.toggle("show",!rows.length);
  if(refit&&rows.length){
    var b=L.latLngBounds(rows.map(function(r){return pos[r.id]}));
    map.fitBounds(b.pad(0.15),{maxZoom:8,animate:false});
  } else if(refit){ map.setView([22.5,80],5); }
}
function renderLegend(){
  var c=counts("statuses");
  var h='<button class="lt" id="lgt" aria-expanded="'+(!legendCollapsed)+'">Status and size <span>'+(legendCollapsed?'+':'−')+'</span></button><div class="lbody">';
  STATUSES.forEach(function(s){ if(!c[s.key]&&!F.statuses.has(s.key)) return;
    var off=F.statuses.size&&!F.statuses.has(s.key);
    h+='<button class="'+(off?"off":"")+'" data-f="statuses" data-v="'+s.key+'"><span class="dot" style="background:'+cssVar(s.c)+'"></span>'+esc(s.key)+'<span class="ct">'+(c[s.key]||0)+'</span></button>';
  });
  h+='<div class="sizes">';
  [1000,10000,100000].forEach(function(n){var d=radius(n)*2; h+='<span><i style="width:'+d+'px;height:'+d+'px"></i>'+(n>=100000?"1 lakh":fmt(n))+'</span>';});
  h+='</div></div>';
  var lg=document.getElementById("legend"); lg.classList.toggle("collapsed",legendCollapsed); lg.innerHTML=h;
}
function selectRow(id,fromList,both){
  selected=id;
  Object.keys(cardEls).forEach(function(k){cardEls[k].classList.toggle("sel",+k===id)});
  var el=cardEls[id], m=markers[id];
  if(el&&(!fromList||both)){ var box=document.getElementById("cards"); if(getComputedStyle(box).overflowY==="auto"){ box.scrollTo({top:el.offsetTop-box.offsetTop-8,behavior:"smooth"}); } else el.scrollIntoView({block:"nearest"}); }
  if(m&&(fromList||both)){ map.setView(m.getLatLng(),Math.max(map.getZoom(),8),{animate:true}); setTimeout(function(){try{m.openTooltip()}catch(e){}},450); }
  toHash();
}

/* ---------- Render ---------- */
function render(opts){
  opts=opts||{};
  var rows=DATA.filter(function(r){return pass(r)});
  var key=JSON.stringify([F.q,[...F.states],[...F.statuses],[...F.types],[...F.sectors],[...F.auths],F.yearFrom,F.yearTo,F.minT,F.maxT]);
  var changed=key!==lastKey; lastKey=key;
  setFilterLabels(); renderActive(rows); renderLegend(); toHash();
  document.getElementById("listcount").textContent=rows.length+" project"+(rows.length===1?"":"s");
  var sorted=sortRows(rows), box=document.getElementById("cards"), frag=document.createDocumentFragment();
  lastRows=sorted; renderSummary(rows); updateShare(rows);
  cardEls={};
  sorted.forEach(function(r){ var d=document.createElement("article"); d.className="card"+(r.id===selected?" sel":""); d.innerHTML=cardHTML(r); d.dataset.id=r.id; cardEls[r.id]=d; frag.appendChild(d); });
  box.innerHTML=""; box.appendChild(frag);
  if(!rows.length) box.innerHTML='<div class="card">No projects match these filters. <button class="linkbtn" data-rm="all">Clear all</button></div>';
  drawMap(rows,changed||opts.refit);
  if(openFacet) renderPop(openFacet);
}

/* ---------- Events ---------- */
function toggle(f,v){
  if(f==="year"){ var y=+v; if(F.yearFrom===y&&F.yearTo===y){F.yearFrom=F.yearTo=null}else{F.yearFrom=F.yearTo=y} }
  else if(F[f]&&F[f].has){ F[f].has(v)?F[f].delete(v):F[f].add(v); }
}
document.addEventListener("click",function(e){
  var t=e.target;
  var fb=t.closest&&t.closest(".fbtn");
  if(fb){
    var facet=fb.parentNode.dataset.facet, was=openFacet===facet; closePops();
    if(!was){ openFacet=facet; renderPop(facet); fb.parentNode.querySelector(".pop").hidden=false; fb.setAttribute("aria-expanded","true"); }
    return;
  }
  var tag=t.closest&&t.closest("[data-f]");
  if(tag&&tag.tagName!=="INPUT"&&!tag.closest(".pop")){ toggle(tag.dataset.f,tag.dataset.v); render(); return; }
  var rm=t.closest&&t.closest("[data-rm]");
  if(rm){ var f=rm.dataset.rm;
    if(f==="all"){F=emptyFilters();document.getElementById("q").value="";}
    else if(f==="q"){F.q="";document.getElementById("q").value="";}
    else if(f==="year"){F.yearFrom=F.yearTo=null}
    else if(f==="trees"){F.minT=F.maxT=null}
    else F[f].delete(rm.dataset.v);
    render(); return; }
  var cl=t.closest&&t.closest("[data-clear]");
  if(cl){ var c=cl.dataset.clear; if(c==="year")F.yearFrom=F.yearTo=null; else if(c==="trees")F.minT=F.maxT=null; else F[c].clear(); render(); return; }
  var yr=t.closest&&t.closest("[data-yr]");
  if(yr){ if(yr.dataset.yr==="last"){F.yearFrom=new Date().getFullYear()-1;F.yearTo=null}else{F.yearFrom=2023;F.yearTo=null} render(); return; }
  var tr=t.closest&&t.closest("[data-tr]");
  if(tr){ F.minT=+tr.dataset.tr; F.maxT=null; render(); return; }
  var ps=t.closest&&t.closest("[data-preset]");
  if(ps){ F=emptyFilters(); document.getElementById("q").value=""; PRESETS[+ps.dataset.preset].set(); closePops(); render(); return; }
  if(t.closest&&t.closest("#dl")){ downloadCsv(); return; }
  if(t.closest&&t.closest("#cplink")){ toHash(); copyText(viewUrl(),"Link to this view copied"); return; }
  var cr=t.closest&&t.closest("[data-copyrow]");
  if(cr){ copyText(rowUrl(DATA[+cr.dataset.copyrow]),"Link to this project copied"); return; }
  var z=t.closest&&t.closest("[data-zoom]");
  if(z){ selectRow(+z.dataset.zoom,true); document.querySelector(".mapcol").scrollIntoView({block:"nearest",behavior:"smooth"}); return; }
  var card=t.closest&&t.closest(".card");
  if(card&&card.dataset.id&&!t.closest("a,button,summary")){ selectRow(+card.dataset.id,true); return; }
  if(!t.closest(".facet")) closePops();
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.matches('.pop input[type=checkbox]')){ toggle(t.dataset.f,t.dataset.v); render(); }
  else if(t.id==="yf"){ F.yearFrom=t.value?+t.value:null; render(); }
  else if(t.id==="yt"){ F.yearTo=t.value?+t.value:null; render(); }
  else if(t.id==="tmin"){ F.minT=t.value!==""?+t.value:null; render(); }
  else if(t.id==="tmax"){ F.maxT=t.value!==""?+t.value:null; render(); }
  else if(t.id==="sort"){ render(); }
});
document.getElementById("q").addEventListener("input",function(e){F.q=e.target.value.trim(); render();});
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("#lgt"); if(b){legendCollapsed=!legendCollapsed; renderLegend();}});
document.getElementById("ftoggle").addEventListener("click",function(){var bar=document.getElementById("bar"); bar.classList.toggle("collapsed"); this.setAttribute("aria-expanded",String(!bar.classList.contains("collapsed")));});
document.getElementById("bar").classList.toggle("collapsed",window.innerWidth<=860);
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closePops(); });
window.addEventListener("hashchange",function(){ if(location.hash.replace(/^#/,"")!==hashStr()){ fromHash(); document.getElementById("q").value=F.q; render({refit:true}); applyPendingRow(); } });
if(window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){render()});

/* ---------- Boot ---------- */
async function loadCsv(){
  var paths=[CSV_NAME, RAW_URL];
  for(var i=0;i<paths.length;i++){
    try{ var res=await fetch(paths[i],{cache:"no-store"}); if(res.ok){ var t=await res.text(); if(t.indexOf("trees_proposed")>=0) return {text:t,src:i===0?"this site's copy of the CSV":"the GitHub repository",live:true,lm:res.headers.get("last-modified")}; } }catch(e){}
  }
  return {text:EMBED_CSV,src:"a snapshot built into this page (the live CSV could not be loaded)"};
}
async function boot(){
  map=L.map("map",{minZoom:4,zoomControl:true,worldCopyJump:false}).setView([22.5,80],5);
  var tileUrl="https://tile.openstreetmap.org/{z}/{x}/{y}.png";
  var tileOpts={maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'};
  var base;
  try{
    if(window.IndiaBoundaryCorrector){ IndiaBoundaryCorrector.extendLeaflet(L); base=L.tileLayer.indiaBoundaryCorrected(tileUrl,tileOpts); }
  }catch(e){ base=null; }
  (base||L.tileLayer(tileUrl,tileOpts)).addTo(map);
  if(L.markerClusterGroup){
    layer=L.markerClusterGroup({maxClusterRadius:40,disableClusteringAtZoom:8,showCoverageOnHover:false,spiderfyOnMaxZoom:false,animate:false,
      iconCreateFunction:function(c){var n=c.getChildCount(), s=n<5?30:n<15?38:46; return L.divIcon({html:"<span>"+n+"</span>",className:"mc",iconSize:[s,s]});}});
  } else layer=L.layerGroup();
  layer.addTo(map);
  var got=await loadCsv();
  var raw=parseCSV(got.text);
  HEADER=parseCSV.header;
  raw.forEach(function(o){o.status_raw=o.status; o._orig=HEADER.map(function(k){return o[k]});});
  var all=prepare(raw);
  DATA=all.filter(function(r){return r.trees!=null&&r.trees>MIN_TREES});
  var seen={};
  DATA.forEach(function(r,i){ r.id=i; var k=hash32((r.source_url||"")+"|"+(r.town||"")+"|"+(r.states[0]||"")+"|"+(r.project_purpose||"").slice(0,30)); while(seen[k]) k+="x"; seen[k]=1; r.key=k; });
  fromHash();
  document.getElementById("q").value=F.q;
  FOOT.shown=DATA.length; FOOT.total=all.length; FOOT.src=got.src; setFooter();
  if(got.live) fetchUpdated(got.lm);
  render({refit:true});
  applyPendingRow();
  setTimeout(function(){map.invalidateSize()},200);
}
boot();
</script>
